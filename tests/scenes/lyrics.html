<!doctype html>
<!-- Smoke-test type pass (transparent): each sung line on a plate, appearing on the 8th at or just before its first
     word (MV.cue) and held long enough to read; the title over the intro. -->
<html><head><style>
  .plate { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); padding: .25em .6em;
           background: rgba(10, 10, 12, .82); color: #f3efe4; font: 600 calc(46px * var(--mv-s)) "Space Grotesk";
           white-space: nowrap; display: none; }
  #title { position: absolute; left: 8%; top: 12%; color: #f3efe4; background: rgba(10,10,12,.82); padding: .2em .5em;
           font: 400 calc(84px * var(--mv-s)) "Instrument Serif"; display: none; }
</style></head>
<body><div id="stage"><div id="title" data-mv-text="title">Hold the Light</div><div class="plate" id="line" data-mv-text="lyric"></div></div>
<script>
const need = s => Math.min(3, Math.max(1.4, 0.8 + 0.055 * s.length));
let show = [];
MV.scene({
  transparent: true,
  setup(mv) {
    // each line: from its cue (beat or 8th at or before the first sung word) until the next line's cue or until it has
    // been readable long enough, whichever is later (but never into the next line)
    const L = mv.song.lyrics;
    show = L.map((x, i) => {
      const t0 = MV.cue(x.words[0].t), next = i + 1 < L.length ? MV.cue(L[i + 1].words[0].t) : mv.duration;
      return {text: x.text, t0, t1: Math.min(next, Math.max(x.end + 0.2, t0 + need(x.text) + 0.1))};
    });
  },
  render(f) {
    const title = document.getElementById("title");
    title.style.display = f.t >= MV.cue(0.5) && f.t < MV.t(3, 2) ? "block" : "none";
    const cur = show.find(x => f.t >= x.t0 && f.t < x.t1), el = document.getElementById("line");
    el.style.display = cur ? "block" : "none";
    el.textContent = cur ? cur.text : "";
  },
});
</script></body></html>
