<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Video Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23ffd23f%22/%3E%3Cpath d=%22M6 4l6 4-6 4z%22 fill=%22%23111%22/%3E%3C/svg%3E">
<style>
@font-face{font-family:Anton;src:url(/fonts/Anton-Regular.ttf)}
@font-face{font-family:Caveat;src:url("/fonts/Caveat[wght].ttf");font-weight:400 700}
@font-face{font-family:SpaceMono;src:url(/fonts/SpaceMono-Regular.ttf)}
:root{--bg:#0f0f10;--panel:#18181a;--card:#202023;--line:#2c2c30;--fg:#ececec;--mut:#9a9aa0;--acc:#ffd23f;--acc2:#ff5c9d;--ok:#5bd68a;--bad:#ff6b5b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--acc)}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:#111;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.small{padding:5px 10px;font-size:13px;border-radius:8px}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;width:100%;background:#121214;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
label{display:block;margin:14px 0 6px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,15,16,.92);backdrop-filter:blur(6px);z-index:5}
header .logo{font-family:Anton,Impact,sans-serif;font-size:24px;letter-spacing:.02em;cursor:pointer}
header .logo span{color:var(--acc)}
header .crumb{color:var(--mut)}
header .sp{flex:1}
main{max-width:1280px;margin:0 auto;padding:24px 18px 80px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:40px;margin:6px 0 4px;letter-spacing:.01em}
h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;margin:0 0 6px}
.hand{font-family:Caveat,cursive;font-size:24px;color:var(--acc)}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .12s}
.pcard:hover{transform:translateY(-2px);border-color:#444}
.pcard .cov{height:150px;background:#000 center/cover no-repeat;display:grid;place-items:center;color:#444;font-family:Anton;font-size:40px}
.pcard .b{padding:12px 14px}
.pcard .t{font-weight:700;font-size:17px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#2a2a2e;color:var(--mut);margin-top:6px}
.new{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:18px;border:2px dashed #3a3a40;border-radius:14px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:24px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
nav.steps{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:6px}
nav.steps div{padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mut);display:flex;gap:10px;align-items:center}
nav.steps div.on{background:var(--card);color:var(--fg)}
nav.steps .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#2a2a2e;color:var(--mut);flex:none}
nav.steps .dot.done{background:var(--ok);color:#111}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.drop{border:2px dashed #3d3d44;border-radius:14px;padding:34px;text-align:center;cursor:pointer;transition:.15s}
.drop.over{border-color:var(--acc);background:#1d1c14}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.ref{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ref img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#000}
.ref input,.ref textarea{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}
.ref input{font-weight:700}
.ref textarea{min-height:58px;font-size:13px}
.ref button{position:absolute;top:6px;right:6px;padding:2px 8px;background:rgba(0,0,0,.65);color:#fff;border:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:16px}
.thumbs .th{position:relative;aspect-ratio:1;background:#000 center/contain no-repeat;border-radius:8px}
.thumbs .th button{position:absolute;top:4px;right:4px;padding:1px 7px;font-size:12px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;display:none}
.thumbs .th:hover button{display:block}
.thumbs .th button.star{right:auto;left:4px;color:#fff}
.thumbs .th button.star.on{display:block;background:var(--acc);color:#111}
.rtabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.rtabs div{padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.rtabs div.on{color:var(--fg);border-color:var(--acc)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bcard.bad{border-color:var(--bad)}
.bcard .im{position:relative;cursor:pointer}
.bcard .im img{width:100%;aspect-ratio:16/9;display:block;background:#000}
.bcard .im .tc{position:absolute;left:6px;bottom:6px;font:12px SpaceMono,monospace;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:5px;color:var(--acc)}
.bcard .bd{padding:9px 11px 11px;font-size:13px}
.bcard .ly{color:var(--mut);font-style:italic;margin:2px 0 6px}
.bcard .fl{color:var(--bad);margin:3px 0}
.cap{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line)}
.cap .ct{flex:1;white-space:pre-wrap}
.cap .ct small{display:block;color:var(--mut)}
.cap.no .ct{color:var(--bad);text-decoration:line-through}
.cap.yes .ct{color:var(--ok)}
.org{font-size:11px;padding:1px 6px;border-radius:99px;background:#2a2a2e;color:var(--mut);white-space:nowrap}
.org.chk{background:#4a3d12;color:var(--acc)}
.org.unk{background:#4a1d18;color:#ffb0a6}
.cap button{padding:2px 8px;font-size:12px;border-radius:6px}
.cap button.sel{outline:2px solid var(--fg)}
.chg{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px}
.chg .w{font-size:11px;padding:0 6px;border-radius:99px;background:#2a2a2e;color:var(--mut)}
.note .fx{display:inline-block;width:100%;color:var(--ok);font-size:13px;margin-top:3px}
.thumbs .th .f{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.6);padding:0 5px;border-radius:5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);cursor:pointer;color:var(--mut);user-select:none}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.steplist{list-style:none;padding:0;margin:16px 0}
.steplist li{padding:7px 0;display:flex;gap:10px;align-items:center;color:var(--mut)}
.steplist li.now{color:var(--fg);font-weight:700}
.steplist li.done{color:var(--ok)}
.spin{width:14px;height:14px;border:2px solid #555;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
pre.log{background:#0b0b0c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12px/1.5 SpaceMono,Consolas,monospace;color:#bbb;max-height:220px;overflow:auto;white-space:pre-wrap}
.cl{display:grid;grid-template-columns:1fr;gap:10px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid var(--line)}
.cl .faces{display:flex;gap:6px;overflow-x:auto}
.cl .faces img{width:78px;height:78px;border-radius:8px;object-fit:cover;flex:none}
.cl .f5{display:grid;grid-template-columns:1.2fr .8fr .9fr 1fr 1fr 1.6fr;gap:8px}
@media(max-width:900px){.cl .f5{grid-template-columns:1fr 1fr}}
.cl.ignored{opacity:.45}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.cards2{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
code.cmd{display:block;background:#0b0b0c;border:1px solid var(--line);padding:12px;border-radius:10px;font:15px SpaceMono,Consolas,monospace;color:var(--acc);margin:8px 0}
video{width:100%;border-radius:12px;background:#000;max-height:64vh}
.vtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.vtabs .chip{font-size:13px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:4px}
.sty{position:relative;background:#151517;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.sty:hover{border-color:#55555c;transform:translateY(-1px)}
.sty.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sty.on::after{content:"\2713";position:absolute;top:7px;left:7px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#111;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.sty img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.sty .zm{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;opacity:.85}
.sty .zm:hover{opacity:1;background:rgba(0,0,0,.85)}
.sty .b{padding:8px 10px 10px;font-size:12.5px;line-height:1.38}
.sty .b b{display:block;font-size:14px;margin-bottom:3px}
.sty .b span{display:block;color:#c9c9ce}
.sty .b i{display:block;color:var(--mut);margin-top:5px;font-size:11.5px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.lbin{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:min(1100px,94vw)}
.lbin img{display:block;width:100%;max-height:72vh;object-fit:contain;background:#000}
.gal summary{cursor:pointer;color:var(--acc);margin:10px 0 6px}
.gal img{width:100%;border-radius:8px;display:block}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
@media(max-width:1000px){.dirs{grid-template-columns:1fr}}
.dir{background:#151517;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dir.on{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.dir .frames{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#000}
.dir .frames img{width:100%;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in;display:block}
.songs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.songs{grid-template-columns:1fr}}
.song{background:#151517;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.song.on{border-color:var(--ok)}
.note{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;background:var(--card);margin-bottom:8px}
.note .ts{font:13px SpaceMono,monospace;background:#2a2a2e;padding:2px 7px;border-radius:6px;cursor:pointer;color:var(--acc);flex:none}
.note .tx{flex:1;white-space:pre-wrap}
.note.done .tx{text-decoration:line-through;color:var(--mut)}
.qa{font-size:13px;color:var(--mut);margin:10px 0 0;padding-left:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2a2a2e;color:var(--fg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.prog{height:6px;background:#2a2a2e;border-radius:4px;overflow:hidden;margin:6px 0}
.prog div{height:100%;background:var(--acc);width:0;transition:width .2s}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
img.sheet{width:100%;border-radius:10px;margin-top:14px}
/* the song viewer */
.sv-facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--mut);margin:2px 0 12px}
.sv-facts b{color:var(--fg);font-weight:600}
.sv-now{display:grid;grid-template-columns:minmax(150px,auto) 1fr minmax(170px,auto);gap:16px;align-items:center;background:#0b0b0c;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;min-height:72px}
.sv-now .big{font:22px Anton,Impact,sans-serif;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.sv-now .big i{display:inline-block;width:12px;height:12px;border-radius:3px}
.sv-now .pos{font:13px SpaceMono,monospace;color:var(--acc);margin-top:2px}
.sv-now .ly{font-size:19px;line-height:1.35}
.sv-now .ly span{color:#5d5d63}
.sv-now .ly span.on{color:var(--fg)}
.sv-now .ly span.now{color:var(--acc)}
.sv-now .ly small{display:block;font-size:12px;color:var(--mut)}
.sv-now .nx{font-size:12.5px;color:var(--mut);text-align:right;line-height:1.5}
.sv-ctl{margin:6px 0 10px;gap:7px}
.sv-ctl .chip{font-size:12.5px;padding:4px 10px}
.sv-ctl .t{font:13px SpaceMono,monospace;min-width:130px}
.sv-ctl .sep{width:1px;height:22px;background:var(--line)}
canvas.sv{width:100%;display:block;border-radius:10px;background:#101114;cursor:crosshair}
#sv-ov{height:58px;margin-bottom:6px}
#sv-cv{height:560px}
.sv-hov{font:12px SpaceMono,monospace;color:var(--mut);min-height:18px;margin:5px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-tbl{width:100%;border-collapse:collapse;font-size:13px}
.sv-tbl td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.sv-tbl tr{cursor:pointer}
.sv-tbl tr:hover td{background:#26262a}
.sv-tbl tr.on td{background:#2b2814}
.sv-scroll{max-height:330px;overflow:auto;margin-top:6px}
.sv-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stars{color:var(--acc);white-space:nowrap;letter-spacing:-1px}
.sv-ly{max-height:640px;overflow:auto;font-size:14px;position:relative;margin-top:6px}
.sv-ly h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.sv-ly .l{display:flex;gap:9px;padding:3px 5px;border-radius:6px;cursor:pointer}
.sv-ly .l:hover{background:#26262a}
.sv-ly .l.on{background:#2b2814}
.sv-ly .l .ts{font:12px SpaceMono,monospace;color:var(--acc);flex:none;padding-top:2px}
.sv-ly .l small{display:block;color:var(--mut);font-size:12px}
.sv-md{font-size:14px}
/* the lyric timing editor */
#pane.lxon #sv-cv{height:300px}
.lx{border-color:var(--acc);margin:0 0 16px}
#lx,#lx *{overflow-anchor:none}          /* re-drawing the editor must not make the browser scroll the page */
.lx-list{position:relative;max-height:46vh;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.lx-r{display:grid;grid-template-columns:46px 92px 52px auto 1fr auto auto;gap:6px;align-items:center;padding:3px 4px;border-bottom:1px solid var(--line)}
.lx-r.now{background:#2b2814}
.lx-part{font:12px SpaceMono,monospace;color:var(--mut);padding:8px 4px 2px}
.lx-r.cur{box-shadow:inset 3px 0 0 var(--acc)}
.lx-n{cursor:pointer;color:var(--mut);font:12px SpaceMono,monospace;text-align:right;user-select:none}
.lx-r.cur .lx-n{color:var(--acc);font-weight:700}
.lx-r .tm{font:12px SpaceMono,monospace;padding:3px 6px;border-radius:6px}
.lx-r.set .tm{color:var(--ok);border-color:#2f5a3e}
.lx-r .te{font:12px SpaceMono,monospace;padding:2px 6px;border-radius:6px;min-width:78px;color:var(--mut)}
.lx-r .te.on{color:var(--ok);border-color:#2f5a3e}
.lx-pos{font:11px SpaceMono,monospace}
.lx-r input{padding:4px 8px}
.lx-r .nd{display:flex;gap:2px}
.lx-r .nd button{padding:2px 7px;font-size:12px;border-radius:6px}
.lx-next{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lx-add{padding:8px 4px}
.lx-r.ab .lx-n::after{content:" ?";color:var(--acc)}
.lx-r.ar .lx-n::after{content:" +";color:var(--acc)}
.lx-r.new{background:#14261b}
.lx-r.new .lx-n::after{content:" new";color:var(--ok);font-size:10px}
.lx-heard{margin-top:8px;font-size:13px}
.lx-heard div{display:flex;gap:8px;align-items:center;padding:2px 0}
.sv-md h2{font-size:24px;margin:4px 0}.sv-md h3{font:600 15px system-ui;margin:14px 0 4px;color:var(--acc)}
.sv-md table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.sv-md td,.sv-md th{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.sv-md blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--line);color:var(--mut)}
.sv-md p{margin:6px 0}

.hint code,.mut code{font:12px SpaceMono,monospace}
.sc{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:#2a2a2e;color:var(--mut);white-space:nowrap}
.sc b{color:var(--fg)}
.sc.lo b{color:var(--bad)}
.crit{margin-top:12px}
.crow{display:flex;gap:8px 10px;align-items:baseline;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.crow .v{font:12px SpaceMono,monospace}
#wcritic .sv-md{margin-top:6px}
#dir-ev{font-size:12px;line-height:1.55}
.ast{font-size:11.5px;padding:1px 8px;border-radius:99px;background:#2a2a2e;color:var(--mut)}
.ast.on{background:var(--acc);color:#111}
.ast.ok{color:var(--ok)}
.ast.no{color:var(--bad)}
.costs{gap:6px 8px;margin-top:12px;font-size:13px}
video{max-height:58vh}
.chip.on .mut{color:#5a4a00}
/* the live view: the scenes in the browser with the song (livePlayer) */
.lv-stage{position:relative;overflow:hidden;background:#000;border-radius:12px;margin:0 auto;cursor:pointer}
.lv-stage>*{position:absolute;left:0;top:0;border:0;pointer-events:none;transition:none}
.lv-stage video,.lv-stage .lv-slate{width:100%;height:100%}
.lv-stage video{object-fit:fill}
.lv-slate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#18181c;color:#bdbbb6;font-size:13px;text-align:center;padding:12px}
.lv-slate b{font:22px Anton,Impact,sans-serif;letter-spacing:.02em;color:var(--fg)}
.lv-bar{gap:8px 10px;margin:0 0 10px;font-size:13px}
.lv-bar select{width:auto;max-width:440px;padding:6px 9px}
.lv-bar input{width:76px;padding:5px 8px}
.lv-bar .chip{font-size:12.5px;padding:4px 10px}
.lv-st{font-size:12.5px;margin:8px 0 4px}
.lv-st div{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.lv-st .lv-k{font:11.5px SpaceMono,monospace}
.lv-st .on b{color:var(--ok)}
.lv-st .slow b,.lv-st .slow{color:var(--acc)}
.lv-st .bad{color:var(--bad)}
a.lv-go{font-weight:700;white-space:nowrap}
/* the pitch round (optional): the form or skip it, the running round, the rounds as cards */
nav.steps .dot.opt{background:transparent;border:1.5px dashed #55555c}
nav.steps .dot.opt.done{background:var(--ok);border:0}
nav.steps .opt-l{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.tag.opt{font:12px system-ui;vertical-align:middle;margin:0 0 0 8px;letter-spacing:0}
#pw-cv{height:64px;margin-top:8px;touch-action:pan-y}
#pw-hov{white-space:normal;margin:4px 0 6px}
.pw-ft{gap:8px}
.pw-ft input{width:100px;padding:5px 8px;font:13px SpaceMono,monospace}
.pv-run{border-color:#4a3d12}
.pv-row{border-top:1px solid var(--line);padding:8px 0 4px;font-size:13px}
.pv-row pre.log{max-height:96px;margin:6px 0 0;font-size:11.5px}
.pv-round{margin-top:16px}
.pv-verdict{background:#151517;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0 14px;font-size:14px}
.pv-verdict ol,.pv-verdict ul{margin:6px 0;padding-left:20px}
.pv-verdict li{margin:2px 0}
.pv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pv-card{background:#151517;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pv-card.win{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.pv-card.picked{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.pv-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.pv-k{font:13px SpaceMono,monospace;color:var(--acc)}
.pv-angle{color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px}
.pv-badge{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--acc);color:#111;font-weight:700}
.pv-badge.ok{background:var(--ok)}
.pv-title{font:24px/1.15 Anton,Impact,sans-serif;letter-spacing:.01em}
.pv-idea{margin:0;color:#d6d6da;font-size:14px}
.pv-style{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pv-style img{width:100%;object-fit:cover;border-radius:6px;background:#000;cursor:zoom-in;display:block}
.pv-media video{max-height:none}
.pv-lvbar{gap:8px;margin-top:6px;font-size:13px}
.pv-lvbar .t{font:12.5px SpaceMono,monospace;white-space:nowrap}
.pv-lvbar input[type=range]{flex:1;min-width:80px;padding:0}
.pv-crit{font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.pv-crit p{margin:4px 0}
.pv-crit .pr{color:var(--mut);margin:3px 0}
.pv-acts{gap:8px 12px;font-size:13px}
</style>
</head>
<body>
<header><div class="logo" onclick="go('')">MUSIC VIDEO <span>STUDIO</span></div><div class="crumb" id="crumb"></div><div class="sp"></div>
<button class="ghost small" onclick="doctor()">Check install</button></header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const api = async (path, opts = {}) => {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);    // a 200 can carry an "error" field (a job that failed): that is data
  return j;
};
const post = (path, body) => api(path, {method: "POST", body: JSON.stringify(body || {})});
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2800); }
const fmt = t => { t = Math.max(0, t); return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0") + "." + Math.floor((t % 1) * 10); };
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(x).padStart(2, "0")}s`; };

let S = null, step = "song", poll = null, dpoll = null;
const STEPS = [["song", "Song & brief"], ["analyse", "Analyse"], ["listen", "The song"], ["story", "Story"], ["pitch", "Pitch round", true],
               ["direct", "Direct"], ["watch", "Watch & review"]];     // (true: optional, a choice, not a stage)

function go(hash) { location.hash = hash; }
window.onhashchange = route;
async function route() {
  clearInterval(poll); clearInterval(dpoll); clearInterval(lxPoll);
  lxRestore(); svStop(); lvStop(); pvClose(); pwHush(); document.onkeydown = document.onkeyup = null;
  const h = location.hash.slice(1).split("/");
  if (!h[0]) return home();
  step = STEPS.some(s => s[0] === h[1]) ? h[1] : "song";
  await load(h[0]);
}

// ---------------------------------------------------------------- home
async function home() {
  $("#crumb").textContent = "";
  const ps = await api("/api/projects");
  $("#main").innerHTML = `<h1>Your music videos</h1><p class="mut">Drop in a song; the studio writes it down so Claude can "hear" it; Claude directs an original motion-graphics video for it, cut to the music.</p>
  <div class="grid" style="margin-top:20px">
    <div class="new"><div class="hand">a new one</div><input id="nn" placeholder="Name, e.g. Night Drive">
      <button onclick="newProject()">Start a music video</button></div>
    ${ps.map(p => `<div class="pcard" onclick="go('${p.name}')"><div class="cov" style="${p.cover ? `background-image:url('${p.cover}')` : ""}">${p.cover ? "" : "&#9654;"}</div>
      <div class="b"><div class="t">${esc(p.title)}</div><div class="mut">${esc(p.song || "no song yet")}${p.versions ? ` &middot; ${p.versions} version${p.versions > 1 ? "s" : ""}` : ""}</div><span class="tag">${esc(p.stage)}</span></div></div>`).join("")}
  </div>`;
}
async function newProject() {
  const n = $("#nn").value.trim(); if (!n) return toast("Give it a name first");
  const r = await post("/api/projects", {name: n, title: n}); go(r.name);
}

// ---------------------------------------------------------------- project shell
async function load(name) {
  S = await api("/api/p/" + name);
  $("#crumb").innerHTML = "/ " + esc(S.project.title || name);
  const openNotes = S.notes.filter(n => !n.done).length;
  const done = {song: !!S.song.file, analyse: !!S.song.map, listen: !!S.song.map, story: S.story.written, pitch: !!(S.pitch && S.pitch.any_picked),
                direct: S.versions.length > 0, watch: S.versions.length > 0 && !openNotes};
  let num = 0;                                  // (the optional step has no number: the steps around it count on)
  $("#main").innerHTML = `<div class="layout"><nav class="steps">${STEPS.map(([k, l, opt]) => { if (!opt) num++;
      return `<div class="${k === step ? "on" : ""}" onclick="go('${name}/${k}')"${opt ? ' title="optional: your choice, never a required step"' : ""}><span class="dot ${done[k] ? "done" : ""} ${opt ? "opt" : ""}">${done[k] ? "&#10003;" : opt ? "" : num}</span>${l}${opt ? ` <span class="opt-l">optional</span>` : ""}${k === "watch" && openNotes ? ` <span class="tag" style="margin:0">${openNotes} notes</span>` : ""}</div>`; }).join("")}</nav>
    <section class="panel" id="pane"></section></div>`;
  ({song: vBrief, analyse: vAnalyse, listen: vListen, story: vStory, pitch: vPitch, direct: vDirect, watch: vWatch})[step]();
}
const refresh = () => load(S.name);

// ---------------------------------------------------------------- 1. song & brief
function vBrief() {
  const p = S.project, s = p.song || {}, f = p.format || {}, pre = f.preset || "1080p";
  const fmts = Object.entries(S.formats).map(([k, v]) => `<option value="${k}" ${pre === k ? "selected" : ""}>${esc(v.label)}</option>`).join("");
  $("#pane").innerHTML = `<h2>Song &amp; brief</h2><p class="mut">The song and what you'd like. Everything except the song is optional, and your notes are a starting point, not a spec: Claude takes them as inspiration and has the freedom to go further (of your notes, only "things to avoid" is a hard rule).</p>
  <div class="drop" id="drop"><b>Drop the song here</b> (MP3, WAV, M4A, FLAC) or click to choose.<br><span class="mut">A lyrics file (.lrc / .txt) can go here too.</span>
    ${S.song.file ? `<div style="margin-top:8px">now: <b>${esc(S.song.file)}</b></div>` : ""}</div><input type="file" id="fi" hidden accept="audio/*,.lrc,.txt">
  <div id="up" class="hint"></div>
  ${S.song.url ? `<audio controls preload="none" src="${S.song.url}" style="width:100%;margin-top:10px"></audio>` : ""}
  <div class="two"><div><label>Artist</label><input id="b-artist" value="${esc(s.artist)}" placeholder="for the lyrics lookup (LRCLIB)"></div>
    <div><label>Song title</label><input id="b-stitle" value="${esc(s.title)}"></div></div>
  <div class="two"><div><label>Language of the lyrics</label><input id="b-lang" value="${esc(s.language)}" placeholder="en, nl, fr... (helps when the lyrics must be transcribed)"></div>
    <div><label>Project name</label><input id="b-title" value="${esc(p.title)}"></div></div>
  <label>What the song is about to you</label><textarea id="b-about" placeholder="Why this song, what it means to you, who it's about...">${esc(p.about)}</textarea>
  <label>Mood or direction</label><textarea id="b-mood" placeholder="e.g. tender and strange; a lot of dance; black and white; nothing cute">${esc(p.mood)}</textarea>
  <div class="two"><div><label>Ideas</label><textarea id="b-ideas" placeholder="images, references, moments you already see">${esc(p.ideas)}</textarea></div>
    <div><label>Things to avoid</label><textarea id="b-avoid" placeholder="colours, symbols, words, looks you don't want">${esc(p.avoid)}</textarea></div></div>
  <label>People &amp; references (optional)</label>
  <div class="hint" style="margin-top:0">Photos of the people in the song (or anything else whose look matters), so Claude knows what everyone looks like. Say who each one is. Claude draws them in the video's own style: the photos themselves never appear in the video, and they stay on this computer.</div>
  <div class="drop" id="rdrop" style="padding:16px;margin-top:8px"><b>Drop photos here</b> (JPG, PNG, WebP) or click to choose</div><input type="file" id="rfi" hidden multiple accept="image/jpeg,image/png,image/webp">
  <div id="rup" class="hint"></div><div class="refs" id="refs"></div>
  <div class="two"><div><label>Delivery format</label><select id="b-fmt" onchange="fmtCustom()">${fmts}<option value="custom" ${pre === "custom" ? "selected" : ""}>custom size / fps</option></select></div>
    <div id="b-cust" style="display:${pre === "custom" ? "grid" : "none"};grid-template-columns:1fr 1fr 1fr;gap:8px;align-self:end">
      <input id="b-w" type="number" value="${f.width || 1920}" title="width"><input id="b-h" type="number" value="${f.height || 1080}" title="height"><input id="b-fps" type="number" value="${f.fps || 30}" title="fps"></div></div>
  <label>Lyrics (optional)</label><textarea id="b-lyrics" style="min-height:120px" placeholder="Only if they're not online (LRCLIB): plain text, or LRC with [mm:ss.xx] line times; word times <mm:ss.xx> are used exactly. [Verse 1] / [Chorus] tags above the parts name the sections; without them, a blank line between stanzas helps the analysis find them.">${esc(p.lyrics)}</textarea>
  <div class="row" style="margin-top:16px"><button onclick="saveBrief()">Save</button><button class="ghost" onclick="saveBrief('analyse')">Save &amp; analyse &rarr;</button></div>`;
  for (const [d, i, out] of [["#drop", "#fi", "#up"], ["#rdrop", "#rfi", "#rup"]]) {
    const drop = $(d), fi = $(i);
    drop.onclick = () => fi.click();
    fi.onchange = () => upload([...fi.files], out);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files], out); };
  }
  renderRefs();
}
function fmtCustom() { $("#b-cust").style.display = $("#b-fmt").value === "custom" ? "grid" : "none"; }
async function upload(files, out = "#up") {
  let whole = false;                  // a song or lyrics file re-draws the page; pictures only their own list
  await refFlush();
  for (const f of files) {
    $(out).innerHTML = `<span class="spin"></span> uploading ${esc(f.name)}&hellip;`;
    try {
      const r = await fetch(`/api/p/${S.name}/upload?filename=${encodeURIComponent(f.name)}`, {method: "PUT", body: f});
      const j = await r.json(); if (j.error) throw new Error(j.error);
      toast(j.kind === "song" ? "Song uploaded: analyse it next" : j.kind === "ref" ? "Picture added: say who it is" : "Lyrics file saved");
      whole = whole || j.kind !== "ref";
    } catch (e) { toast(f.name + ": " + e.message); }
  }
  $(out).textContent = "";
  if (whole) return refresh();
  S = await api("/api/p/" + S.name); renderRefs();
}
function renderRefs() {
  const el = $("#refs"); if (!el) return;
  el.innerHTML = (S.project.refs || []).map(r => `<div class="ref" data-id="${r.id}"><img src="/p/${S.name}/${esc(r.file)}?v=${r.id}" alt="${esc(r.name)}" loading="lazy">
      <button class="small" title="Remove this picture" onclick="refEdit(${r.id},{delete:true})">&#10005;</button>
      <input data-k="name" value="${esc(r.name)}" placeholder="who is this?"><textarea data-k="note" placeholder="a note, e.g. the singer, red coat">${esc(r.note)}</textarea></div>`).join("");
  el.querySelectorAll("[data-k]").forEach(i => i.onchange = () => refEdit(+i.closest(".ref").dataset.id, {[i.dataset.k]: i.value}));
}
async function refFlush() {          // a name still being typed is saved before the list is drawn again
  const a = document.activeElement, card = a && a.closest && a.closest(".ref");
  if (card && a.dataset.k) await refEdit(+card.dataset.id, {[a.dataset.k]: a.value});
}
async function refEdit(id, ch) {
  try { S.project.refs = await post(`/api/p/${S.name}/ref`, {id, ...ch}); if (ch.delete) renderRefs(); } catch (e) { toast(e.message); }
}
async function saveBrief(next) {
  const fm = $("#b-fmt").value;
  const body = {title: $("#b-title").value, about: $("#b-about").value, mood: $("#b-mood").value, ideas: $("#b-ideas").value,
                avoid: $("#b-avoid").value, lyrics: $("#b-lyrics").value,
                song: {artist: $("#b-artist").value, title: $("#b-stitle").value, language: $("#b-lang").value},
                format: fm === "custom" ? {preset: "custom", width: +$("#b-w").value, height: +$("#b-h").value, fps: +$("#b-fps").value} : {preset: fm}};
  try { await post(`/api/p/${S.name}/brief`, body); toast("Saved"); next ? go(`${S.name}/${next}`) : refresh(); } catch (e) { toast(e.message); }
}

// ---------------------------------------------------------------- 2. analyse
function vAnalyse() {
  const a = S.project.analysis, rep = S.song.report || {}, w = rep.warnings || [];
  $("#pane").innerHTML = `<h2>Analyse</h2><p class="mut">Splits the song into voice / drums / bass / other, finds every beat and bar, the lyrics (online, yours, or transcribed), the melody, chords and sections, and writes it all down in the song folder Claude reads. A few minutes (faster with an NVIDIA GPU). The first run downloads the analysis models.</p>
  ${S.song.file ? "" : `<p style="color:var(--bad)">Upload the song first.</p>`}
  <div class="row"><button id="go-ingest" onclick="startJob('ingest')" ${S.song.file ? "" : "disabled"}>${a ? "Analyse again" : "Analyse the song"}</button><button class="ghost small" id="stop-ingest" onclick="stopJob()" style="display:none">Stop</button></div>
  <ul class="steplist" id="sl-ingest"></ul><div id="wn-ingest"></div><pre class="log" id="lg-ingest" style="display:none"></pre>
  <div id="res">${a ? `<div class="box" style="margin-top:14px"><b>Done</b> <span class="mut">${esc(a.at || "")}</span><br>
    ${fmt(a.duration)} &middot; ${Math.round(a.bpm)} BPM &middot; ${esc(a.key)} &middot; ${a.sections} sections &middot; lyrics: ${a.lyrics_lines ? `${a.lyrics_lines} lines (${esc(a.lyrics_source)})` : "none"}
    <div class="hint">stems: ${esc(a.stems)}<br>beats: ${esc(a.beats)}</div>
    ${w.length ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--acc)">${w.length} warning${w.length > 1 ? "s" : ""} in the song report</summary><ul class="qa">${w.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
    <div class="row" style="margin-top:12px"><button onclick="go('${S.name}/listen')">See the song &rarr;</button><button class="ghost" onclick="go('${S.name}/story')">Story &rarr;</button></div></div>` : ""}</div>`;
  watchJob("ingest");
}
async function startJob(kind, body, onDone) {
  try { await post(`/api/p/${S.name}/${kind === "story" ? "story-draft" : kind}`, body || {}); toast("Started"); watchJob(kind, onDone); } catch (e) { toast(e.message); }
}
async function stopJob() { const r = await post(`/api/p/${S.name}/stop`); toast(r.stopping || "Stopping"); }
let jobKinds = [];
const isJob = (j, k) => !!j && (j.job === k || j.chained === k);     // (pitch --auto: the round, then its director run)
const directing = j => !!(j && j.running && isJob(j, "direct"));
function renderJob(j) {
  lastJob = j;
  jobKinds.forEach(k => {
    const g = $("#go-" + k), st = $("#stop-" + k);
    if (g) g.disabled = !!j.running || g.dataset.off === "1";
    if (st) st.style.display = j.running && isJob(j, k) ? "" : "none";
  });
  const kind = jobKinds.find(k => j.job === k) || jobKinds.find(k => j.chained === k);
  if (!kind) return;
  const sl = $("#sl-" + kind), lg = $("#lg-" + kind), wn = $("#wn-" + kind);
  if (sl && j.steps) sl.innerHTML = j.steps.map((s, i) => `<li class="${i < j.i || j.state === "done" ? "done" : i === j.i && j.running ? "now" : ""}">${i < j.i || j.state === "done" ? "&#10003;" : i === j.i && j.running ? '<span class="spin"></span>' : "&middot;"} ${esc(s)}</li>`).join("");
  if (wn) wn.innerHTML = (j.warnings && j.warnings.length ? `<ul class="qa" style="color:var(--acc)">${j.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : "")
    + (j.state === "error" && j.error ? `<p style="color:var(--bad)">${esc(j.error)}</p>` : "");      // (drawn whole each time: nothing piles up)
  if (lg && j.log && j.log.length) { lg.style.display = ""; lg.textContent = j.log.join("\n"); lg.scrollTop = 1e9; }
}
let sawRunning = false;
function watchJob(kinds, onDone) {
  jobKinds = [].concat(kinds || []);
  clearInterval(poll);
  const tick = async () => {
    const j = await api(`/api/p/${S.name}/job`);
    renderJob(j);
    if (j.running) { if (jobKinds.some(k => isJob(j, k))) sawRunning = true; return; }
    clearInterval(poll);
    if (sawRunning) {
      sawRunning = false;
      if (j.returncode === 0) { toast("Finished"); onDone ? onDone() : refresh(); } else toast("Something went wrong: see the log");
    }
  };
  tick(); poll = setInterval(tick, 1500);
}

// ---------------------------------------------------------------- 3. the song (viewer)
async function svEnsure() {
  if (SV.project !== S.name || SV.mapUrl !== S.song.map) {
    const [m, env] = await Promise.all([api(S.song.map), api(S.song.env)]);
    Object.assign(SV, {project: S.name, mapUrl: S.song.map, m, env, src: "mix", sched: -1, lastLine: null, lastSec: null, ed: null});
    svIndex(); svCenter(m.music.start, 0.02);
  }
}
async function vListen() {
  svStop();
  if (!S.song.map) {
    $("#pane").innerHTML = `<h2>The song</h2><p class="mut">This page shows the song the way Claude reads it: the sections, where it builds and drops, the melody, the chords, every beat, what the voice, drums, bass and other instruments do, and when each word is sung. It appears after <b>Analyse</b>.</p><button onclick="go('${S.name}/analyse')">Go to Analyse</button>`;
    return;
  }
  $("#pane").innerHTML = `<h2>The song</h2><p class="mut"><span class="spin"></span> loading the song map&hellip;</p>`;
  await svEnsure();
  const cur = S.song, m = SV.m, t = m.tempo, mu = m.music, vo = m.vocals, lm = m.lyrics_meta || {};
  const stemChips = [["mix", "Mix", "M"], ["vocals", "Voice", "V"], ["drums", "Drums", "D"], ["bass", "Bass", "B"], ["other", "Other", "O"]]
    .filter(([k]) => k === "mix" || cur.stems[k]);
  let lyr = "", sec = null;
  for (const x of m.lyrics) {
    const s = SV.lineSec[x.i];
    if (s !== sec) { sec = s; lyr += `<h4>${esc(s ? s.name : "")}</h4>`; }
    const mel = [x.contour, x.peak ? `peak ${x.peak.note}${x.peak.word ? ` on “${x.peak.word}”` : ""}` : "",
                 ...(x.words || []).filter(w => (w.held || 0) >= 0.6).slice(0, 2).map(w => `holds “${w.w}” ${w.held.toFixed(1)} s`)].filter(Boolean);
    lyr += `<div class="l" data-t="${Math.max(0, x.t - 0.6)}" data-li="${x.i}"><span class="ts">${fmt(x.t)}</span><div>${esc(x.text)}${x.repeat ? ` <span class="org">×${x.repeat + 1}</span>` : ""}<small>${esc(x.pos || "")}${mel.length ? " · " + esc(mel.join("; ")) : ""}</small></div></div>`;
  }
  const src = (lm.source || "").startsWith("transcribed") ? `<span style="color:var(--bad)">transcribed from the vocals: check the words</span>` : lm.source ? esc(lm.source) : "";
  const warn = (S.song.report || {}).warnings || [];
  const rough = /estimate|transcribed/.test(lm.source || "") || (warn.some(w => /never force-aligned/.test(w)) && m.lyrics.length);
  $("#pane").innerHTML = `<h2>The song</h2>
  <p class="mut" style="margin-top:0">The song the way Claude reads it. <b>Space</b> play/pause &middot; <b>&larr; &rarr;</b> a bar &middot; <b>[ ]</b> a section &middot; <b>M V D B O</b> the mix or one instrument alone &middot; <b>K</b> beat click &middot; click the lanes to jump, scroll to look around.</p>
  <div class="sv-facts"><span><b>${esc(m.artist ? m.artist + " – " : "")}${esc(m.title || m.file)}</b></span><span><b>${t.bpm}</b> BPM &middot; bar ${t.bar_s.toFixed(2)} s</span>
    <span>key <b>${esc(m.key.name)}</b></span><span>music <b>${fmt(mu.start)}–${fmt(mu.end)}</b> of ${fmt(m.duration)}</span>
    <span><b>${m.loudness.integrated_lufs}</b> LUFS &middot; range ${m.loudness.range_lu} LU</span>${vo.range ? `<span>voice <b>${vo.range[0]}–${vo.range[1]}</b></span>` : ""}
    <span>${m.sections.length} sections &middot; <b>${m.moments.filter(x => x.stars >= 3).length}</b> big moments</span></div>
  ${warn.length ? `<details class="hint" style="margin-bottom:8px"><summary style="cursor:pointer;color:var(--acc)">${warn.length} warning${warn.length > 1 ? "s" : ""}: how far to trust this</summary><ul class="qa">${warn.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}

async function pvLoad(force) {

function pvRun(R) {                   // the round at work: per pitch its angle, state, time, cost, agents, last lines

// ---------------------------------------------------------------- the live player (the scenes in the browser, with the song)
// livePlayer(el, {base, delivery: {w, h, fps}, n, size: [w, h], scale, layers, audio, offset: () => ms, onStatus, onClick,
//                  window: [t0, t1]?}) -> {layers, P, play(), pause(), seek(t), destroy(), reload(ids), top(frame)}
// The layers come from GET /api/p/<p>/live (tools/mv/live.py), bottom to top: an iframe from the project's live server
// (a scene: the renderer's own page with the runtime in live mode), a muted <video> (a rendered pass) or a slate, each
// shown only inside its slots (song frames [a, b)). The audio element is the clock: on every frame while it plays, and on
// a seek or a pause, each scene gets {type: "mv-clock", t, playing, rate}; outside its slots it gets its next slot's first
// frame (or its last one), paused, so it is ready when its slot comes. A scene loads when the playhead is within 15 s of
// one of its slots (6 at most stay loaded); its status comes back as "mv-live" messages (the achieved fps, catching up,
// errors). The picture runs `offset` ms behind the audio element (Bluetooth headphones play the sound late). While the
// audio element loads a new source (a switch of stems), the picture holds where it was. A video layer follows the audio
// within a frame (its speed nudged, or a seek when it is far off). With `window` (song seconds), play() starts at t0 when
// the playhead is outside it and the audio pauses at t1 (the pitch round's proof window).
// One piece, so it can be embedded anywhere (the Watch page; the pitch round's cards).
function livePlayer(el, o) {
  const fps = o.delivery.fps, n = Math.max(1, o.n), [W, H] = o.size, AHEAD = 15 * fps, KEEP = 6;
  const P = {dead: false, raf: 0, seek: false, t: 0, f: 0, playing: false, k: 1, had: false, swap: 0};
  el.innerHTML = `<div class="lv-stage"></div>`;
  const stage = el.firstChild;
  const layers = o.layers.map((l, z) => ({...l, z, el: null, st: null, sent: null, on: false}));
  const fit = () => {
    if (P.dead) return;
    const ar = o.delivery.w / o.delivery.h, sw = Math.max(160, Math.floor(Math.min(el.clientWidth || 640, window.innerHeight * 0.6 * ar)));
    stage.style.width = sw + "px"; stage.style.height = Math.round(sw / ar) + "px";
    P.k = sw / W;
    for (const l of layers) if (l.el && l.kind === "scene") l.el.style.transform = `scale(${P.k})`;
  };
  const slotAt = (l, f) => l.slots.find(([a, b]) => f >= a && f < b);
  const near = (l, f) => l.slots.some(([a, b]) => f >= a - AHEAD && f < b + 3 * fps);
  const dist = (l, f) => Math.min(...l.slots.map(([a, b]) => f < a ? a - f : f >= b ? f - b + 1 : 0));
  function load(l) {
    let e;
    if (l.kind === "scene") {
      e = document.createElement("iframe");
      e.setAttribute("sandbox", "allow-scripts allow-same-origin");     // its own origin (the live server): no reach into this page
      e.setAttribute("scrolling", "no"); e.tabIndex = -1; e.title = l.label;
      Object.assign(e.style, {width: W + "px", height: H + "px", transformOrigin: "0 0", transform: `scale(${P.k})`});
      e.onload = () => { l.sent = null; };                              // (re)loaded: its clock again
      e.src = `${o.base}${l.src}&scale=${o.scale}`;
    } else if (l.kind === "video") {
      e = document.createElement("video"); e.muted = true; e.playsInline = true; e.preload = "auto"; e.src = l.video_url;
    } else {
      e = document.createElement("div"); e.className = "lv-slate";
      e.innerHTML = `<b>${esc(l.label)}</b><span>${esc(l.note || "not playable live")}</span>`;
    }
    e.style.zIndex = l.z; e.style.opacity = 0;
    if (l.mode && l.mode !== "normal") e.style.mixBlendMode = l.mode;
    stage.appendChild(e);
    Object.assign(l, {el: e, st: null, sent: null, loaded: performance.now()});
  }
  function unload(l) {
    if (!l.el) return;
    if (l.kind === "video") { l.el.pause(); l.el.removeAttribute("src"); l.el.load(); }
    if (l.kind === "scene") l.el.src = "about:blank";
    l.el.remove(); Object.assign(l, {el: null, st: null, sent: null, on: false});
  }
  function onMsg(e) {
    if (e.origin !== o.base || !e.data || e.data.type !== "mv-live") return;
    const l = layers.find(x => x.el && x.kind === "scene" && x.el.contentWindow === e.source);
    if (l) l.st = e.data;
  }
  const onSeek = () => { if (P.swap && performance.now() - P.swap < 2000) { P.swap = 0; return; } P.seek = true; };  // (a new source put back where it was: no jump)
  function loop() {
    if (P.dead) return;
    P.raf = requestAnimationFrame(loop);
    const a = o.audio, off = (o.offset ? +o.offset() || 0 : 0) / 1000;
    if (a && a.readyState >= 1) P.had = true;
    const swap = !!a && P.had && a.readyState < 1;              // a new source is loading: its time reads 0 until it's in
    if (swap) P.swap = performance.now();
    if (a && o.window && !a.paused && a.currentTime >= o.window[1]) a.pause();
    const t = swap ? P.t : Math.max(0, (a ? a.currentTime : 0) - off), f = clamp(Math.round(t * fps), 0, n - 1);
    const playing = !swap && !!a && !a.paused && !a.seeking && !a.ended && a.readyState >= 3, rate = (a && a.playbackRate) || 1;
    const seek = P.seek && !swap; if (!swap) P.seek = false;
    Object.assign(P, {t, f, playing});
    for (const l of layers) if (!l.el && (l.kind !== "scene" || near(l, f))) load(l);
    const live = layers.filter(l => l.el && l.kind === "scene");
    if (live.length > KEEP)
      live.filter(l => !near(l, f)).sort((x, y) => dist(y, f) - dist(x, f)).slice(0, live.length - KEEP).forEach(unload);
    for (const l of layers) {
      if (!l.el) continue;
      l.on = !!slotAt(l, f);
      l.el.style.opacity = l.on ? (l.opacity ?? 1) : 0;
      const nx = l.slots.find(([a0]) => a0 > f), last = l.slots[l.slots.length - 1];
      const lt = l.on ? t : (nx ? nx[0] : last[1] - 1) / fps, lp = l.on && playing;
      if (l.kind === "scene") {
        const key = `${lt.toFixed(4)}|${lp}|${rate}`;
        if (seek || lp || key !== l.sent) {
          l.sent = key;
          try { l.el.contentWindow.postMessage({type: "mv-clock", t: lt, playing: lp, rate, seek}, o.base); } catch (e) { /* still loading */ }
        }
      } else if (l.kind === "video") {
        const v = l.el, want = Math.max(0, lt - (l.video_t0 || 0)), drift = v.currentTime - want;
        if (lp) {
          if (v.paused) v.play().catch(() => {});
          if (Math.abs(drift) > 0.5) { v.currentTime = want; l.nudge = false; }          // far off: a seek
          else if (Math.abs(drift) > 1 / fps) l.nudge = true;                           // a frame off: a little faster or slower
          else if (Math.abs(drift) < 0.3 / fps) l.nudge = false;                        //   until it is back on the beat
          const r = l.nudge ? rate * (1 - clamp(drift * 2, -0.1, 0.1)) : rate;
          if (Math.abs(v.playbackRate - r) > 1e-3) v.playbackRate = r;
        } else {
          if (!v.paused) v.pause();
          if (!v.seeking && Math.abs(v.currentTime - want) > 0.5 / fps) v.currentTime = want;
        }
      }
    }
  }
  window.addEventListener("message", onMsg);
  window.addEventListener("resize", fit);
  if (o.audio) o.audio.addEventListener("seeking", onSeek);
  const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
  if (ro) ro.observe(el);
  fit();
  stage.onclick = () => o.onClick && o.onClick();
  P.raf = requestAnimationFrame(loop);
  const sti = o.onStatus ? setInterval(() => { if (!P.dead) o.onStatus(layers, P); }, 250) : 0;
  return {
    layers, P,
    play() {
      const a = o.audio; if (!a) return;
      if (o.window && (a.currentTime < o.window[0] || a.currentTime >= o.window[1] - 0.05)) a.currentTime = o.window[0];
      a.play().catch(() => {});
    },
    pause() { if (o.audio) o.audio.pause(); },
    seek(t) { if (o.audio) o.audio.currentTime = Math.max(0, +t || 0); },
    destroy() {
      P.dead = true; cancelAnimationFrame(P.raf); clearInterval(sti); if (ro) ro.disconnect();
      window.removeEventListener("message", onMsg); window.removeEventListener("resize", fit);
      if (o.audio) o.audio.removeEventListener("seeking", onSeek);
      layers.forEach(unload); el.innerHTML = "";
    },
    reload(ids) { layers.filter(l => ids.includes(l.id) && l.el && l.kind === "scene").forEach(l => { unload(l); load(l); }); },
    top(f) { return layers.slice().reverse().find(l => !l.transparent && slotAt(l, f)) || null; },   // what the picture is made of there
  };
}

// ---------------------------------------------------------------- 6b. the live view (Watch & review, "▶ live")
// The project's scenes as they are now, played with the song: the timeline from work/live.json, the plan or the renders
// (or a pitch's draft plan, or any scene alone), the song's lanes under it (#sv-au: Space, the click, the stems), N for a
// note (version "live": a running director gets it within seconds). Every 5 s it looks again: a changed scene reloads.
const LVS = {L: null, pick: null, player: null, poll: 0, wait: 0, sig: "", vers: {}, notes: "", opts: ""};
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* private mode: not kept */ } };
const lvOn = () => step === "watch" && wsel === "live";
const lvOffset = () => +lsGet("mv-live-offset", "0") || 0;
function lvStop() { clearInterval(LVS.poll); LVS.poll = 0; if (LVS.player) { LVS.player.destroy(); LVS.player = null; } }
function lvTimelines(L) {             // the picker: the timelines, then each scene alone
  return L.timelines.map(x => ({key: x.source, label: x.label, layers: x.layers, warnings: x.warnings || []}))
    .concat(L.scenes.map(sc => ({key: "scene:" + sc.path, label: sc.path, single: true, warnings: [],
      layers: [{id: "scene", kind: "scene", label: sc.path, scene: sc.path, src: sc.src, slots: [[0, L.n]], transparent: false,
                mode: "normal", opacity: 1, version: sc.version ?? sc.mtime}]})));
}
const lvSig = tl => JSON.stringify(tl.layers.map(l => [l.id, l.kind, l.src, l.video, l.slots, l.transparent, l.mode, l.opacity, l.note]));
function lvScaleNow() { const s = lsGet("mv-live-scale", "0.5"); return ["0.25", "0.5", "1"].includes(s) ? s : "0.5"; }
async function vLive(L) {
  LVS.L = L; SV.lvGap = 0;
  const tls = lvTimelines(L);
  if (!tls.some(x => x.key === LVS.pick)) LVS.pick = (tls.find(x => x.layers.length) || tls[0]).key;
  const sc = lvScaleNow(), cur = S.song;
  const stemChips = [["mix", "Mix", "M"], ["vocals", "Voice", "V"], ["drums", "Drums", "D"], ["bass", "Bass", "B"], ["other", "Other", "O"]].filter(([k]) => k === "mix" || cur.stems[k]);
  if (SV.src !== "mix" && !cur.stems[SV.src]) SV.src = "mix";
  $("#pane").innerHTML = `<h2>Watch &amp; review</h2>
