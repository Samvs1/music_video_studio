<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Video Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23ffd23f%22/%3E%3Cpath d=%22M6 4l6 4-6 4z%22 fill=%22%23111%22/%3E%3C/svg%3E">
<style>
@font-face{font-family:Anton;src:url(/fonts/Anton-Regular.ttf)}
@font-face{font-family:Caveat;src:url("/fonts/Caveat[wght].ttf");font-weight:400 700}
@font-face{font-family:SpaceMono;src:url(/fonts/SpaceMono-Regular.ttf)}
:root{--bg:#0f0f10;--panel:#18181a;--card:#202023;--line:#2c2c30;--fg:#ececec;--mut:#9a9aa0;--acc:#ffd23f;--acc2:#ff5c9d;--ok:#5bd68a;--bad:#ff6b5b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--acc)}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:#111;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.small{padding:5px 10px;font-size:13px;border-radius:8px}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;width:100%;background:#121214;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
label{display:block;margin:14px 0 6px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,15,16,.92);backdrop-filter:blur(6px);z-index:5}
header .logo{font-family:Anton,Impact,sans-serif;font-size:24px;letter-spacing:.02em;cursor:pointer}
header .logo span{color:var(--acc)}
header .crumb{color:var(--mut)}
header .sp{flex:1}
main{max-width:1280px;margin:0 auto;padding:24px 18px 80px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:40px;margin:6px 0 4px;letter-spacing:.01em}
h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;margin:0 0 6px}
.hand{font-family:Caveat,cursive;font-size:24px;color:var(--acc)}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--line);transition:transform .12s}
.pcard:hover{transform:translateY(-2px);border-color:#444}
.pcard .cov{height:150px;background:#000 center/cover no-repeat;display:grid;place-items:center;color:#444;font-family:Anton;font-size:40px}
.pcard .b{padding:12px 14px}
.pcard .t{font-weight:700;font-size:17px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#2a2a2e;color:var(--mut);margin-top:6px}
.new{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:18px;border:2px dashed #3a3a40;border-radius:14px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:24px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
nav.steps{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:6px}
nav.steps div{padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mut);display:flex;gap:10px;align-items:center}
nav.steps div.on{background:var(--card);color:var(--fg)}
nav.steps .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#2a2a2e;color:var(--mut);flex:none}
nav.steps .dot.done{background:var(--ok);color:#111}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
.drop{border:2px dashed #3d3d44;border-radius:14px;padding:34px;text-align:center;cursor:pointer;transition:.15s}
.drop.over{border-color:var(--acc);background:#1d1c14}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.ref{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ref img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#000}
.ref input,.ref textarea{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}
.ref input{font-weight:700}
.ref textarea{min-height:58px;font-size:13px}
.ref button{position:absolute;top:6px;right:6px;padding:2px 8px;background:rgba(0,0,0,.65);color:#fff;border:0}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:16px}
.thumbs .th{position:relative;aspect-ratio:1;background:#000 center/contain no-repeat;border-radius:8px}
.thumbs .th button{position:absolute;top:4px;right:4px;padding:1px 7px;font-size:12px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;display:none}
.thumbs .th:hover button{display:block}
.thumbs .th button.star{right:auto;left:4px;color:#fff}
.thumbs .th button.star.on{display:block;background:var(--acc);color:#111}
.rtabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.rtabs div{padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.rtabs div.on{color:var(--fg);border-color:var(--acc)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bcard.bad{border-color:var(--bad)}
.bcard .im{position:relative;cursor:pointer}
.bcard .im img{width:100%;aspect-ratio:16/9;display:block;background:#000}
.bcard .im .tc{position:absolute;left:6px;bottom:6px;font:12px SpaceMono,monospace;background:rgba(0,0,0,.7);padding:1px 6px;border-radius:5px;color:var(--acc)}
.bcard .bd{padding:9px 11px 11px;font-size:13px}
.bcard .ly{color:var(--mut);font-style:italic;margin:2px 0 6px}
.bcard .fl{color:var(--bad);margin:3px 0}
.cap{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line)}
.cap .ct{flex:1;white-space:pre-wrap}
.cap .ct small{display:block;color:var(--mut)}
.cap.no .ct{color:var(--bad);text-decoration:line-through}
.cap.yes .ct{color:var(--ok)}
.org{font-size:11px;padding:1px 6px;border-radius:99px;background:#2a2a2e;color:var(--mut);white-space:nowrap}
.org.chk{background:#4a3d12;color:var(--acc)}
.org.unk{background:#4a1d18;color:#ffb0a6}
.cap button{padding:2px 8px;font-size:12px;border-radius:6px}
.cap button.sel{outline:2px solid var(--fg)}
.chg{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px}
.chg .w{font-size:11px;padding:0 6px;border-radius:99px;background:#2a2a2e;color:var(--mut)}
.note .fx{display:inline-block;width:100%;color:var(--ok);font-size:13px;margin-top:3px}
.thumbs .th .f{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.6);padding:0 5px;border-radius:5px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);cursor:pointer;color:var(--mut);user-select:none}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.steplist{list-style:none;padding:0;margin:16px 0}
.steplist li{padding:7px 0;display:flex;gap:10px;align-items:center;color:var(--mut)}
.steplist li.now{color:var(--fg);font-weight:700}
.steplist li.done{color:var(--ok)}
.spin{width:14px;height:14px;border:2px solid #555;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;display:inline-block}
@keyframes s{to{transform:rotate(360deg)}}
pre.log{background:#0b0b0c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12px/1.5 SpaceMono,Consolas,monospace;color:#bbb;max-height:220px;overflow:auto;white-space:pre-wrap}
.cl{display:grid;grid-template-columns:1fr;gap:10px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid var(--line)}
.cl .faces{display:flex;gap:6px;overflow-x:auto}
.cl .faces img{width:78px;height:78px;border-radius:8px;object-fit:cover;flex:none}
.cl .f5{display:grid;grid-template-columns:1.2fr .8fr .9fr 1fr 1fr 1.6fr;gap:8px}
@media(max-width:900px){.cl .f5{grid-template-columns:1fr 1fr}}
.cl.ignored{opacity:.45}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.cards2{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
code.cmd{display:block;background:#0b0b0c;border:1px solid var(--line);padding:12px;border-radius:10px;font:15px SpaceMono,Consolas,monospace;color:var(--acc);margin:8px 0}
video{width:100%;border-radius:12px;background:#000;max-height:64vh}
.vtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.vtabs .chip{font-size:13px}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:4px}
.sty{position:relative;background:#151517;border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.sty:hover{border-color:#55555c;transform:translateY(-1px)}
.sty.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sty.on::after{content:"\2713";position:absolute;top:7px;left:7px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#111;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.sty img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000}
.sty .zm{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;opacity:.85}
.sty .zm:hover{opacity:1;background:rgba(0,0,0,.85)}
.sty .b{padding:8px 10px 10px;font-size:12.5px;line-height:1.38}
.sty .b b{display:block;font-size:14px;margin-bottom:3px}
.sty .b span{display:block;color:#c9c9ce}
.sty .b i{display:block;color:var(--mut);margin-top:5px;font-size:11.5px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.lbin{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:min(1100px,94vw)}
.lbin img{display:block;width:100%;max-height:72vh;object-fit:contain;background:#000}
.gal summary{cursor:pointer;color:var(--acc);margin:10px 0 6px}
.gal img{width:100%;border-radius:8px;display:block}
.dirs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
@media(max-width:1000px){.dirs{grid-template-columns:1fr}}
.dir{background:#151517;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dir.on{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.dir .frames{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#000}
.dir .frames img{width:100%;aspect-ratio:16/9;object-fit:cover;cursor:zoom-in;display:block}
.songs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.songs{grid-template-columns:1fr}}
.song{background:#151517;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.song.on{border-color:var(--ok)}
.note{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;background:var(--card);margin-bottom:8px}
.note .ts{font:13px SpaceMono,monospace;background:#2a2a2e;padding:2px 7px;border-radius:6px;cursor:pointer;color:var(--acc);flex:none}
.note .tx{flex:1;white-space:pre-wrap}
.note.done .tx{text-decoration:line-through;color:var(--mut)}
.qa{font-size:13px;color:var(--mut);margin:10px 0 0;padding-left:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2a2a2e;color:var(--fg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.prog{height:6px;background:#2a2a2e;border-radius:4px;overflow:hidden;margin:6px 0}
.prog div{height:100%;background:var(--acc);width:0;transition:width .2s}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
img.sheet{width:100%;border-radius:10px;margin-top:14px}
/* the song viewer */
.sv-facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--mut);margin:2px 0 12px}
.sv-facts b{color:var(--fg);font-weight:600}
.sv-now{display:grid;grid-template-columns:minmax(150px,auto) 1fr minmax(170px,auto);gap:16px;align-items:center;background:#0b0b0c;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;min-height:72px}
.sv-now .big{font:22px Anton,Impact,sans-serif;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.sv-now .big i{display:inline-block;width:12px;height:12px;border-radius:3px}
.sv-now .pos{font:13px SpaceMono,monospace;color:var(--acc);margin-top:2px}
.sv-now .ly{font-size:19px;line-height:1.35}
.sv-now .ly span{color:#5d5d63}
.sv-now .ly span.on{color:var(--fg)}
.sv-now .ly span.now{color:var(--acc)}
.sv-now .ly small{display:block;font-size:12px;color:var(--mut)}
.sv-now .nx{font-size:12.5px;color:var(--mut);text-align:right;line-height:1.5}
.sv-ctl{margin:6px 0 10px;gap:7px}
.sv-ctl .chip{font-size:12.5px;padding:4px 10px}
.sv-ctl .t{font:13px SpaceMono,monospace;min-width:130px}
.sv-ctl .sep{width:1px;height:22px;background:var(--line)}
canvas.sv{width:100%;display:block;border-radius:10px;background:#101114;cursor:crosshair}
#sv-ov{height:58px;margin-bottom:6px}
#sv-cv{height:560px}
.sv-hov{font:12px SpaceMono,monospace;color:var(--mut);min-height:18px;margin:5px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-tbl{width:100%;border-collapse:collapse;font-size:13px}
.sv-tbl td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:top}
.sv-tbl tr{cursor:pointer}
.sv-tbl tr:hover td{background:#26262a}
.sv-tbl tr.on td{background:#2b2814}
.sv-scroll{max-height:330px;overflow:auto;margin-top:6px}
.sv-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.stars{color:var(--acc);white-space:nowrap;letter-spacing:-1px}
.sv-ly{max-height:640px;overflow:auto;font-size:14px;position:relative;margin-top:6px}
.sv-ly h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600}
.sv-ly .l{display:flex;gap:9px;padding:3px 5px;border-radius:6px;cursor:pointer}
.sv-ly .l:hover{background:#26262a}
.sv-ly .l.on{background:#2b2814}
.sv-ly .l .ts{font:12px SpaceMono,monospace;color:var(--acc);flex:none;padding-top:2px}
.sv-ly .l small{display:block;color:var(--mut);font-size:12px}
.sv-md{font-size:14px}
/* the lyric timing editor */
#pane.lxon #sv-cv{height:300px}
.lx{border-color:var(--acc);margin:0 0 16px}
#lx,#lx *{overflow-anchor:none}          /* re-drawing the editor must not make the browser scroll the page */
.lx-list{position:relative;max-height:46vh;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.lx-r{display:grid;grid-template-columns:46px 92px 52px auto 1fr auto auto;gap:6px;align-items:center;padding:3px 4px;border-bottom:1px solid var(--line)}
.lx-r.now{background:#2b2814}
.lx-r.cur{box-shadow:inset 3px 0 0 var(--acc)}
.lx-n{cursor:pointer;color:var(--mut);font:12px SpaceMono,monospace;text-align:right;user-select:none}
.lx-r.cur .lx-n{color:var(--acc);font-weight:700}
.lx-r .tm{font:12px SpaceMono,monospace;padding:3px 6px;border-radius:6px}
.lx-r.set .tm{color:var(--ok);border-color:#2f5a3e}
.lx-r .te{font:12px SpaceMono,monospace;padding:2px 6px;border-radius:6px;min-width:78px;color:var(--mut)}
.lx-r .te.on{color:var(--ok);border-color:#2f5a3e}
.lx-pos{font:11px SpaceMono,monospace}
.lx-r input{padding:4px 8px}
.lx-r .nd{display:flex;gap:2px}
.lx-r .nd button{padding:2px 7px;font-size:12px;border-radius:6px}
.lx-next{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lx-add{padding:8px 4px}
.lx-r.ab .lx-n::after{content:" ?";color:var(--acc)}
.lx-r.ar .lx-n::after{content:" +";color:var(--acc)}
.lx-r.new{background:#14261b}
.lx-r.new .lx-n::after{content:" new";color:var(--ok);font-size:10px}
.lx-heard{margin-top:8px;font-size:13px}
.lx-heard div{display:flex;gap:8px;align-items:center;padding:2px 0}
.sv-md h2{font-size:24px;margin:4px 0}.sv-md h3{font:600 15px system-ui;margin:14px 0 4px;color:var(--acc)}
.sv-md table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.sv-md td,.sv-md th{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.sv-md blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--line);color:var(--mut)}
.sv-md p{margin:6px 0}

.hint code,.mut code{font:12px SpaceMono,monospace}
.sc{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:#2a2a2e;color:var(--mut);white-space:nowrap}
.sc b{color:var(--fg)}
.sc.lo b{color:var(--bad)}
.crit{margin-top:12px}
.crow{display:flex;gap:8px 10px;align-items:baseline;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.crow .v{font:12px SpaceMono,monospace}
#wcritic .sv-md{margin-top:6px}
#dir-ev{font-size:12px;line-height:1.55}
video{max-height:58vh}
.chip.on .mut{color:#5a4a00}
</style>

<body>
<header><div class="logo" onclick="go('')">MUSIC VIDEO <span>STUDIO</span></div><div class="crumb" id="crumb"></div><div class="sp"></div>
<button class="ghost small" onclick="doctor()">Check install</button></header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const api = async (path, opts = {}) => {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);    // a 200 can carry an "error" field (a job that failed): that is data
  return j;
};
const post = (path, body) => api(path, {method: "POST", body: JSON.stringify(body || {})});
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2800); }
const fmt = t => { t = Math.max(0, t); return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0") + "." + Math.floor((t % 1) * 10); };
const dur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${m}m ${String(x).padStart(2, "0")}s`; };

let S = null, step = "song", poll = null, dpoll = null;
const STEPS = [["song", "Song & brief"], ["analyse", "Analyse"], ["listen", "The song"], ["story", "Story"], ["direct", "Direct"], ["watch", "Watch & review"]];

function go(hash) { location.hash = hash; }
window.onhashchange = route;
async function route() {
  clearInterval(poll); clearInterval(dpoll); clearInterval(lxPoll);
  lxRestore(); svStop(); document.onkeydown = document.onkeyup = null;
  const h = location.hash.slice(1).split("/");
  if (!h[0]) return home();
  step = STEPS.some(s => s[0] === h[1]) ? h[1] : "song";
  await load(h[0]);
}

// ---------------------------------------------------------------- home
async function home() {
  $("#crumb").textContent = "";
  const ps = await api("/api/projects");
  $("#main").innerHTML = `<h1>Your music videos</h1><p class="mut">Drop in a song; the studio writes it down so Claude can "hear" it; Claude directs an original motion-graphics video for it, cut to the music.</p>
  <div class="grid" style="margin-top:20px">

// ---------------------------------------------------------------- 1. song & brief

function fmtCustom() { $("#b-cust").style.display = $("#b-fmt").value === "custom" ? "grid" : "none"; }
async function upload(files, out = "#up") {
  let whole = false;                  // a song or lyrics file re-draws the page; pictures only their own list
  await refFlush();
  for (const f of files) {
    $(out).innerHTML = `<span class="spin"></span> uploading ${esc(f.name)}&hellip;`;
    try {
      const r = await fetch(`/api/p/${S.name}/upload?filename=${encodeURIComponent(f.name)}`, {method: "PUT", body: f});
      const j = await r.json(); if (j.error) throw new Error(j.error);
      toast(j.kind === "song" ? "Song uploaded: analyse it next" : j.kind === "ref" ? "Picture added: say who it is" : "Lyrics file saved");
      whole = whole || j.kind !== "ref";
    } catch (e) { toast(f.name + ": " + e.message); }
  }
  $(out).textContent = "";
  if (whole) return refresh();
  S = await api("/api/p/" + S.name); renderRefs();
}
function renderRefs() {
  const el = $("#refs"); if (!el) return;
  el.innerHTML = (S.project.refs || []).map(r => `<div class="ref" data-id="${r.id}"><img src="/p/${S.name}/${esc(r.file)}?v=${r.id}" alt="${esc(r.name)}" loading="lazy">
      <button class="small" title="Remove this picture" onclick="refEdit(${r.id},{delete:true})">&#10005;</button>
      <input data-k="name" value="${esc(r.name)}" placeholder="who is this?"><textarea data-k="note" placeholder="a note, e.g. the singer, red coat">${esc(r.note)}</textarea></div>`).join("");
  el.querySelectorAll("[data-k]").forEach(i => i.onchange = () => refEdit(+i.closest(".ref").dataset.id, {[i.dataset.k]: i.value}));
}
async function refFlush() {          // a name still being typed is saved before the list is drawn again
  const a = document.activeElement, card = a && a.closest && a.closest(".ref");
  if (card && a.dataset.k) await refEdit(+card.dataset.id, {[a.dataset.k]: a.value});
}
async function refEdit(id, ch) {
  try { S.project.refs = await post(`/api/p/${S.name}/ref`, {id, ...ch}); if (ch.delete) renderRefs(); } catch (e) { toast(e.message); }
}
async function saveBrief(next) {

async function startJob(kind, body, onDone) {
  try { await post(`/api/p/${S.name}/${kind === "story" ? "story-draft" : kind}`, body || {}); toast("Started"); watchJob(kind, onDone); } catch (e) { toast(e.message); }
}
async function stopJob() { const r = await post(`/api/p/${S.name}/stop`); toast(r.stopping || "Stopping"); }
let jobKinds = [];
function renderJob(j) {
  jobKinds.forEach(k => {
    const g = $("#go-" + k), st = $("#stop-" + k);
    if (g) g.disabled = !!j.running || g.dataset.off === "1";
    if (st) st.style.display = j.running && j.job === k ? "" : "none";
  });
  if (!j.job || !jobKinds.includes(j.job)) return;
  const sl = $("#sl-" + j.job), lg = $("#lg-" + j.job), wn = $("#wn-" + j.job);
  if (sl && j.steps) sl.innerHTML = j.steps.map((s, i) => `<li class="${i < j.i || j.state === "done" ? "done" : i === j.i && j.running ? "now" : ""}">${i < j.i || j.state === "done" ? "&#10003;" : i === j.i && j.running ? '<span class="spin"></span>' : "&middot;"} ${esc(s)}</li>`).join("");
  if (wn && j.warnings && j.warnings.length) wn.innerHTML = `<ul class="qa" style="color:var(--acc)">${j.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>`;
  if (lg && j.log && j.log.length) { lg.style.display = ""; lg.textContent = j.log.join("\n"); lg.scrollTop = 1e9; }
  if (wn && j.state === "error" && j.error) wn.innerHTML += `<p style="color:var(--bad)">${esc(j.error)}</p>`;
}
let sawRunning = false;
function watchJob(kinds, onDone) {
  jobKinds = [].concat(kinds || []);
  clearInterval(poll);
  const tick = async () => {
    const j = await api(`/api/p/${S.name}/job`);
    renderJob(j);
    if (j.running) { if (jobKinds.includes(j.job)) sawRunning = true; return; }
    clearInterval(poll);
    if (sawRunning) {
      sawRunning = false;
      if (j.returncode === 0) { toast("Finished"); onDone ? onDone() : refresh(); } else toast("Something went wrong: see the log");
    }
  };
  tick(); poll = setInterval(tick, 1500);
}

// ---------------------------------------------------------------- the lyric timing editor (on The song page)
// Tap along (Enter as each line starts), nudge, fix the words, add the repeats; the lanes and the line above them show
// the edit while the song plays. Saved as LRC in project.json "lyrics", timed on this very song file; then the song is
// analysed again, so every word gets aligned inside its line and the voice, sections and moments follow the lines.
function lxParse(text) {          // lyrics text -> [{t, text, words}]: LRC times (and word times) kept, "[Chorus]" tags skipped
  const out = []; let last = -1, k = 0;
  for (const raw of String(text || "").split(/\r?\n/)) {
    const line = raw.trim(); if (!line || line.startsWith("#")) continue;
    const stamps = [...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)].map(m => +m[1] * 60 + +m[2]);
    const body = line.replace(/\[[^\]]*\]/g, ""), em = body.match(/<(\d+):(\d+(?:\.\d+)?)>\s*$/), e0 = em ? +em[1] * 60 + +em[2] : null;
    const words = [...body.matchAll(/<(\d+):(\d+(?:\.\d+)?)>\s*([^<]*)/g)].flatMap(m => m[3].trim().split(/\s+/).filter(Boolean).map((w, j) => [w, +m[1] * 60 + +m[2] + 0.001 * j]));
    const txt = body.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
    if (!txt) continue;
    if (!stamps.length) { out.push({t: null, end: null, text: txt, words: null, key: last + 1e-6 * ++k}); continue; }
    last = stamps[0];
    stamps.forEach(t => out.push({t, text: txt, key: t, end: e0 != null && e0 > stamps[0] + 0.05 ? e0 - stamps[0] + t : null,
      words: words.length && words.map(x => x[0]).join(" ") === txt ? words.map(([w, wt]) => [w, wt - stamps[0] + t]) : null}));
  }
  return out.sort((a, b) => a.key - b.key).map(({key, ...x}) => x);
}
function lxFromSong() {           // where the editor starts: your own LRC as written, else the analysed lines, else the brief's text
  const m = SV.m, meta = m.lyrics_meta || {}, ly = S.project.lyrics, txt = ly && typeof ly === "object" ? ly.text : ly;
  if (/^user \(LRC/.test(meta.source || "") && txt) {
    const off = meta.offset || 0, fixed = new Set((S.project.lyrics_set || []).map(t => Math.round(t * 100)));
    const xs = lxParse(txt), mine = x => fixed.has(Math.round(x.t * 100)) || !!x.words, same = xs.length === m.lyrics.length;
    return xs.map((x, k) => x.t == null ? x : !S.project.lyrics_synced || mine(x) || !same    // your own times: as you set them
      ? {...x, t: x.t + off, end: x.end == null ? null : x.end + off, words: x.words && x.words.map(([w, t]) => [w, t + off]), set: S.project.lyrics_synced && mine(x)}
      : {...x, t: m.lyrics[k].t, end: null, words: null});                                   // the rest: where the analysis put it
  }
  if (m.lyrics.length) return m.lyrics.map(x => ({t: x.t, end: x.end_src === "user" ? x.end : null, text: x.text, words: null}));
  return lxParse(txt);
}
function lxOpen() {
  if (!SV.m) return;
  if (!SV.ed) SV.ed = {lines: lxFromSong().map(x => ({set: false, eset: false, ...x})), cur: 0, hist: [], dirty: false, now: null,
                       heardOnly: ((SV.m.lyrics_meta || {}).heard_only || []).map(h => ({...h}))};
  if (!SV.ed.open) { SV.ed.orig = SV.m.lyrics; SV.ed.open = true; }
  $("#pane").classList.add("lxon");
  lxRender(); lxView();
  if (!SV.ed.lines.length) lxPasteBox();
  const top = $(".sv-now"); if (top) window.scrollTo(0, top.getBoundingClientRect().top + window.scrollY - 76);   // at once: nothing still moving when you tap
}
function lxRestore() {            // the song's own lines back in the lanes (the edit itself is kept until saved or cancelled)
  const ed = SV.ed; if (!ed || !ed.open) return;
  SV.m.lyrics = ed.orig; SV.lt = SV.m.lyrics.map(x => x.t); SV.lastLine = null; SV.dirty = true; ed.open = false;
}
function lxClose() {
  if (SV.ed && SV.ed.dirty && !confirm("Close without saving? Your timing changes are lost.")) return;
  lxRestore(); SV.ed = null; $("#pane").classList.remove("lxon"); $("#lx").innerHTML = "";
}
window.addEventListener("beforeunload", e => { if (SV.ed && SV.ed.dirty) { e.preventDefault(); e.returnValue = ""; } });
function lxView() {               // the edit, as the song map's lyric lines: the lanes, the line above them and the hover use it
  const xs = SV.ed.lines.map((x, k) => ({...x, k})).filter(x => x.t != null && x.text).sort((a, b) => a.t - b.t);
  SV.m.lyrics = xs.map((x, j) => {
    const nx = xs[j + 1], ws = x.text.split(/\s+/);
    const end = x.end != null ? Math.max(x.t + 0.2, x.end) : Math.max(x.t + 0.3, Math.min(nx ? nx.t - 0.05 : x.t + 6, x.t + Math.max(1.2, 0.42 * ws.length)));
    const words = x.words ? x.words.map(([w, t]) => ({w, t})) : ws.map((w, i) => ({w, t: x.t + (end - x.t) * i / ws.length}));
    return {i: -1 - x.k, k: x.k, t: x.t, end, uend: x.end != null, text: x.text, words};
  });
  SV.lt = SV.m.lyrics.map(x => x.t); SV.lastLine = null; SV.ed.now = undefined; SV.dirty = true;
}
function lxRender() {
  const ed = SV.ed, el = $("#lx"); if (!el || !ed) return;
  const y0 = window.scrollY;                        // the page stays where it is while the editor is drawn again
  const n = ed.lines.length, nset = ed.lines.filter(x => x.set).length, none = ed.lines.filter(x => x.t == null).length, nx = ed.lines[ed.cur];
  el.innerHTML = `<div class="box lx">
